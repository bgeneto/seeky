# dataset-fetch runtime dependencies
#
# Runtime dependency set: EMPTY.
#
# The tool and its tests use only the Python standard library (hashlib, json,
# gzip, unicodedata, urllib, argparse, pathlib, tempfile, unittest). There is no
# package index access, no build backend, and nothing to hash-lock.
#
# Python: >=3.12,<4
# Last verified with: CPython 3.15.0 on Windows (development host)
#
# If a dependency is ever added, record the exact version and wheel/sdist hash
# here and install with `pip install --require-hashes -r requirements.lock`.
