# SDC draft drafter runtime dependencies
#
# Runtime dependency set: EMPTY.
#
# The drafter and its tests use only the Python standard library (argparse,
# hashlib, json, re, subprocess, unicodedata, unittest). There is no package
# index access, no build backend, and nothing to hash-lock.
#
# The only external program is the pinned llama.cpp release and the pinned
# Qwen2.5-1.5B-Instruct GGUF; both are recorded with versions, revisions, and
# weight SHA-256 in ../NOTICE.md and live outside the repository.
#
# Python: >=3.12,<4
# Last verified with: CPython 3.15.0 on Windows (development host)
#
# If a dependency is ever added, record the exact version and wheel/sdist hash
# here and install with `pip install --require-hashes -r requirements.lock`.
