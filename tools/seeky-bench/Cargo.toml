[package]
name = "seeky-bench"
description = "Internal headless benchmark harness for Seeky (never shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "seeky_bench"
path = "src/lib.rs"

[[bin]]
name = "seeky-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
seeky-engine = { path = "../../crates/seeky-engine" }
seeky-eval = { path = "../../crates/seeky-eval" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Audited process facts for `perf` (SPEC-0001 section 5.3, SPEC-0003 R27).
# MIT OR Apache-2.0; already in Cargo.lock; seeky-bench never ships.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
