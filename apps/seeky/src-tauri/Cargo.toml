[package]
name = "seeky"
version = "0.1.0"
description = "Local neural information retrieval engine and semantic desktop search"
authors = ["Seeky contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seeky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
walkdir = "2.5.1"
notify = "9"
regex = "1.13.2"
anyhow = "1.0.105"
thiserror = "2.0.21"
zip = "9.8.2"
calamine = "0.38.0"
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_7881", "image_latest", "thread_safe"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std", "half"] }
openvino = { version = "0.11.2", features = ["runtime-linking"] }
openvino-sys = { version = "0.11.2", features = ["runtime-linking"] }
tokenizers = "0.23.2"
half = "2.7.1"
tauri-plugin-dialog = "2.8.4"
blake3 = "1.8.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
