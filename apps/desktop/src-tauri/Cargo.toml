[package]
name = "seeky-desktop"
description = "Local neural information retrieval engine and semantic desktop search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seeky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The executable keeps its PoC name (SPEC-0001 R10).
[[bin]]
name = "seeky"
path = "src/main.rs"

[features]
# Runs tests that need local assets or hardware (Gety model files, PDFium,
# CUDA, Intel NPU). Off by default so `cargo test` is hardware-free.
hw-tests = []

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
calamine = { workspace = true }
pdfium-render = { workspace = true }
ort = { workspace = true }
openvino = { workspace = true }
openvino-sys = { workspace = true }
tokenizers = { workspace = true }
half = { workspace = true }
tauri-plugin-dialog = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
